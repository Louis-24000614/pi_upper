# 导航前视相机与 BEV / 路宽先验 —— 白底白沿推荐初值
# 设计见 docs/superpowers/specs/2026-09-03-white-on-white-road-perception-design.md
# 实车标定后只改本文件。

# 练车场检查（人工）：
# - 路面 / 侧沿 / 岛区同色，已装真实高度矮沿
# - 训练集不以黑胶带为唯一边线

camera:
  # 光心离地 13 cm，相对水平低头 28°，装在车体中线（无横滚、无偏航）。
  height_m: 0.13
  pitch_deg: 28.0
  # 当前镜头水平视场 85°。说明书上的 63.3° 与实车不符，按那个值鸟瞰会把路压到 0.40 m 内，预瞄 0.45 m 永远够不着。
  # fx = 0.5 * 1280 / tan(85°/2)，方像素，主点在画面中心。还没做地面四点标定。
  fx: 698.37
  fy: 698.37
  cx: 640.0
  cy: 360.0

bev:
  # 相机高度 13 cm、俯角 28°；BEV 范围沿用下方配置。
  y_min: 0.12
  y_max: 1.00
  x_min: -0.5
  x_max: 0.5
  m_per_px: 0.01

capture:
  # udev 规则 config/udev/99-nav-camera.rules 把 DHZJ 导航相机固定到这个名字。
  # 不要写 /dev/videoN：再插入识别相机后，编号会换。
  device: /dev/nav_camera
  width: 1280
  height: 720

# uart6-m1 → /dev/ttyS6，921600 8N1。只跟眼前这条路，路口不选左右。
uart:
  device: /dev/ttyS6
  baud: 921600

# 当前保留校正接口并沿用原路口流程，不新增停车校准等待。
# 下位机烧录支持 HEADING_REFERENCE 的固件后，才可启用参考同步。
heading_anchor:
  enabled: false

# 启用 --turn-at-junction 时：前进 15 cm 到 0_J、停稳、按 Agent 下一条边原地转向。
entrance:
  forward_mm: 150
  forward_speed_mmps: 50
  stop_settle_ms: 2000
  reacquire_frames: 3
  # 重新锁定后先低速跟踪约 10 帧，再恢复 follow.cruise_mps。
  recovery_frames: 10
  recovery_mps: 0.06

follow:
  # 正常视觉循迹稍微降速，给分割和转向纠偏留出更多反应时间。
  cruise_mps: 0.08
  turn_mps: 0.05
  lookahead_m: 0.25
  turn_abs_x_m: 0.08
  min_points: 8
  # 墙角分割常只剩 250～380 px，400 会把还能看到的路判成没路。
  min_road_pixels: 200
  max_abs_omega: 1.0
  # 实车录像中道路中心已经向左移，但原 +3 cm 偏置抵消了大部分左转纠偏。
  x_bias_m: 0.00
  # 增强视觉纠偏；仍受 max_abs_omega 限制。
  steering_gain: 2.0
  # 固定 25 cm 预瞄越过可见路面后，仍利用近处道路低速纠偏，不要过早盲走。
  min_lookahead_m: 0.24
  near_mps: 0.05

# 同色过分割时的几何兜底（vision/ipm_proto）
road_prior:
  # 赛题 PDF 图 3 给出的道路净宽为 200 mm；800 mm 是格网间距，不是车道宽。
  expected_width_m: 0.20
  # 上下限给分割毛边、场地约 5% 尺寸误差和 BEV 标定误差留余量。
  min_width_m: 0.14
  max_width_m: 0.32
  min_pixels: 3

# 侧向支路按地图锁存；到点检测方式由 nav_topology.yaml 中 arrival 决定。
# visual_end 看检测带，visual_odom 看支路和里程；最后由下位机执行定距。
# 自动转弯只有命令行显式指定 --turn-at-junction/--left-at-junction 才启用。
junction_turn:
  stable_frames: 2
  handoff_min_distance_m: 0.18
  # 远处只锁存；侧路中心进入 35 cm 内才允许交接，避免刚看到就提前转。
  handoff_max_distance_m: 0.35
  camera_ahead_of_turn_center_m: 0.00  # 实测：相机光心比两轮中心靠前的距离
  stop_before_center_m: 0.00
  forward_speed_mmps: 50
  # 每次转弯交接后固定前进 20 cm，明确停车后再原地转。
  turn_forward_m: 0.20
  stop_settle_ms: 2000
  min_forward_mm: 50
  max_forward_mm: 650
  reacquire_frames: 3
  # visual_end 策略：侧向的角只锁存路口，正前方检测带判断交接。
  # 检测带稳定无 road mask 后，IMU 锁航向再走 20 cm 到路口中心。
  road_end_enabled: true
  road_end_min_y_m: 0.20
  # 实车回放中蓝色检测带占比已降到 0.08 时，走廊最远点约为 0.37 m。
  road_end_max_y_m: 0.40
  # 图中蓝色区域：BEV 正前方 34–48 cm 的中央走廊。
  # 侧边角只锁存路口；这里的 road mask 占比连续 3 帧 <=10% 才走最后 20 cm。
  road_end_band_min_y_m: 0.34
  road_end_band_max_y_m: 0.48
  road_end_band_max_ratio: 0.10
  road_end_missing_frames: 3
  # 支路已锁存但视觉预瞄刚丢失时，末端通常还在约 0.42 m；允许最后一次 20 cm 交接。
  road_end_stopped_max_y_m: 0.45
  blind_forward_m: 0.20
  road_end_max_abs_lane_x_m: 0.08
  road_end_min_lane_width_m: 0.14
  road_end_max_lane_width_m: 0.32
  # 侧路角无论远近都只锁存方向，不直接触发 20 cm。
  branch_observe_min_distance_m: 0.18
  branch_observe_max_distance_m: 0.95
  # 最近 8 帧里有 2 帧看到部分支路就锁存，之后被墙遮住也不清除。
  branch_vote_window: 8
  branch_vote_min: 2
  # 仅普通路口尚未交接时，ODOM 到预计节点前 5 cm 保护停车；巡检点不启用。
  odom_stop_margin_m: 0.05

# 保留原巡检点视觉接近参数；--turn-at-junction 只取消 UID 输入，下面的
# 侧边锁存、检测带、15 cm 和速度值仍按原样使用。独立 --turn-at-rfid
# 硬件测试也复用本段的停车/重新捕获参数。
rfid_turn:
  stop_settle_ms: 2000
  reacquire_frames: 3
  # 巡逻点先用视觉循迹；左右任一矮沿端头只负责锁存。
  # 蓝色正前方检测带的 road mask 稳定消失后，才盲走一次 20 cm。
  edge_visible_frames: 2
  road_end_missing_frames: 3
  road_end_band_max_ratio: 0.10
  search_step_distance_mm: 200
  # 最后 20 cm 由 IMU 锁定上电基准维护出的当前方向档位；完成后直接按
  # 当前拓扑节点推进，不再等待 UID。
  search_speed_mmps: 50
  # 所有 0.97 m 标准边：前段视觉循迹并持续更新绝对道路航向；
  # 0.57 m 若航向仍未锁定，停车后只根据前半段保存的方向样本摆正。
  # 样本仍不可靠则保持停车；后段按实际交接里程补齐到 0.97 m。
  early_lock_sample_start_m: 0.35
  early_lock_min_depth_m: 0.18
  early_lock_frames: 3
  early_lock_max_spread_rad: 0.10
  early_lock_handoff_m: 0.57
  early_lock_stop_settle_s: 0.30
  # 视觉提前丢失时，只有已接近交接区且已有可靠航向才允许切换 IMU。
  early_lock_fallback_min_m: 0.45
  early_lock_blocked_frames: 3

temporal:
  # 帧间中心线 X 的 EMA；70% 采用新帧，使纠偏在约 2 帧内完成主要响应，
  # 同时保留 30% 历史量抑制道路 mask 的单帧抖动。
  smooth_alpha: 0.70
  # 与上一帧点匹配时允许的最大 |ΔY|（米）
  y_match_tol_m: 0.04

# 摆正/涵洞直线判定的车道方向参考：正前方近距窄条（forward_lane_heading）。
# 墙端停车时车前可见路面只剩约 0.12～0.21 m，参考带必须近而浅才剩得下点；
# 窄条剔除侧向开口的点，避免摆正追着开口转向、爬行压向侧墙。
# 条内点不足时方向视为未知：不摆正、涵洞不判直线，是安全退化。
lane_heading:
  strip_x_m: 0.09
  y_min_m: 0.14
  y_max_m: 0.28
  min_points: 3
  # 前向可见深度低于该值时（墙端死区）不再信当下实测，改用干净窗口
  # 携带的中位数方向；普通路口深度足够，仍用实测。
  # 墙端停车时仍有 ~0.20 m 连续中心线（重放实测），静止测量可信。
  min_live_depth_m: 0.18

# 路口接近转向（追踪器确认非直路后锁存，直路连续 straight_clear_frames 帧解除）：
# 转向点列先过正前方窄带，固定 0.25 m 预瞄点不再落进侧向开口；
# 走廊尽头短于固定预瞄时改按近距预瞄低速前进（min_lookahead_m / min_points
# 仅作用于该锁存路径，普通循迹配置不受影响）。
junction_approach:
  strip_abs_x_m: 0.10
  min_lookahead_m: 0.16
  min_points: 4
  straight_clear_frames: 8
