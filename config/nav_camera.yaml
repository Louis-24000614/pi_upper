# 导航前视相机与 BEV / 路宽先验 —— 白底白沿推荐初值
# 设计见 docs/superpowers/specs/2026-09-03-white-on-white-road-perception-design.md
# 实车标定后只改本文件。

# 练车场检查（人工）：
# - 路面 / 侧沿 / 岛区同色，已装真实高度矮沿
# - 训练集不以黑胶带为唯一边线

camera:
  # 光心离地 16 cm，相对水平低头 28°，装在车体中线（无横滚、无偏航）。
  height_m: 0.16
  pitch_deg: 28.0
  # fx/fy/cx/cy 可省略：运行时按图像宽与约 63.3° FOV 估算，尚未做地面四点标定
  # fx: 1015.0
  # fy: 1015.0
  # cx: 640.0
  # cy: 360.0

bev:
  # 16 cm / 28° 时 1280×720 大约只看到车前 0.15–1.0 m，再远没有像素。
  y_min: 0.20
  y_max: 1.00
  x_min: -0.5
  x_max: 0.5
  m_per_px: 0.01

capture:
  device: /dev/video0
  width: 1280
  height: 720

# uart6-m1 → /dev/ttyS6，921600 8N1。只跟眼前这条路，路口不选左右。
uart:
  device: /dev/ttyS6
  baud: 921600

follow:
  cruise_mps: 0.10
  turn_mps: 0.06
  lookahead_m: 0.45
  turn_abs_x_m: 0.08
  min_points: 8
  min_road_pixels: 400
  max_abs_omega: 1.0

# 同色过分割时的几何兜底（vision/ipm_proto）
road_prior:
  expected_width_m: 0.8
  min_width_m: 0.35
  max_width_m: 1.15
  min_pixels: 3

temporal:
  # 帧间中心线 X 的 EMA；越大越跟新帧
  smooth_alpha: 0.45
  # 与上一帧点匹配时允许的最大 |ΔY|（米）
  y_match_tol_m: 0.04
