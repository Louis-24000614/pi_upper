# 赛题图 3 先验拓扑（行列命名 v3）
#
# 节点名 = 行_列
#   - 行：从上往下增大（离开出发区）
#   - 列：从左往右
#       _1 左侧巡逻格
#       _2 中间偏左十字路口
#       _3 中间偏右十字路口
#       _4 右侧巡逻格
#   - 0_0：出发区
#   - 0_J：出发区正前方的顶端丁字路口（不是 RFID 巡逻点）
#
# 与图 6 巡逻点位置的大致对应（拓扑名 ≠ 播报点号）：
#   出发区先由 0_0 直行到 0_J，再从 0_J 分别通往：1_2≈①  1_3≈⑫
#   这一排没有 1_1、1_4
#   2_1≈②  2_4≈⑪
#   3_1≈③  3_4≈⑩
#   4_1≈④  4_4≈⑨
#   5_1≈⑤  5_2≈⑥  5_3≈⑦  5_4≈⑧
#
# 每一横档（如 ②↔⑪）中间是两个十字：*_2 与 *_3，不是单点、也不是整图只有两个口。
#
# 坐标：原点场地左下角，x 右、y 上，单位米；约 3.2×4.4 m。仅供调试画图。
# 边 id 必须加引号，格式 "{u}__{v}"（端点名字典序较小者在前）。
# 隧道：右侧通往 ⑨⑩⑪ 一带阴影通道初标，场测按实场四段改。
# blocked 为运行时状态，勿写入本文件。

meta:
  name: figure3_rowcol_v3
  field_size_m: { width: 3.2, height: 4.4 }
  naming: row_col
  start_junction: "0_J"
  # 实车从 0_0 前进 15 cm 到 0_J 后，第一圈固定右转进入图上左侧的 1_2（①）。
  start_exit: "1_2"
  columns:
    "1": left_patrol_or_bottom
    "2": mid_left_cross_or_bottom
    "3": mid_right_cross_or_bottom
    "4": right_patrol_or_bottom
  notes: >
    中间双十字列（_2/_3）竖向连通形成中央格网。
    若实场某横档不是双十字，删除对应节点/边即可。

nodes:
  "0_0": { x: 1.60, y: 4.20, role: start }
  "0_J": { x: 1.60, y: 3.60, role: junction, arrival: { mode: visual_odom } }

  # 行 1：出发区左右两条出口，就是 ① 和 ⑫
  "1_2": { x: 1.20, y: 3.60, role: patrol_slot }
  "1_3": { x: 2.00, y: 3.60, role: patrol_slot }

  # 行 2（≈② / 两十字 / ≈⑪）
  "2_1": { x: 0.40, y: 2.80, role: patrol_slot }
  "2_2": { x: 1.20, y: 2.80, role: junction, arrival: { mode: visual_odom } }
  "2_3": { x: 2.00, y: 2.80, role: junction, arrival: { mode: visual_odom } }
  "2_4": { x: 2.80, y: 2.80, role: patrol_slot }

  # 行 3（≈③ / 两十字 / ≈⑩）
  "3_1": { x: 0.40, y: 2.00, role: patrol_slot }
  "3_2": { x: 1.20, y: 2.00, role: junction, arrival: { mode: visual_odom } }
  "3_3": { x: 2.00, y: 2.00, role: junction, arrival: { mode: visual_odom } }
  "3_4": { x: 2.80, y: 2.00, role: patrol_slot }

  # 行 4（≈④ / 两十字 / ≈⑨）
  "4_1": { x: 0.40, y: 1.20, role: patrol_slot }
  "4_2": { x: 1.20, y: 1.20, role: junction, arrival: { mode: visual_odom } }
  "4_3": { x: 2.00, y: 1.20, role: junction, arrival: { mode: visual_odom } }
  "4_4": { x: 2.80, y: 1.20, role: patrol_slot }

  # 行 5 底边（≈⑤⑥⑦⑧，四格均为巡逻位置）
  "5_1": { x: 0.40, y: 0.40, role: patrol_slot }
  "5_2": { x: 1.20, y: 0.40, role: patrol_slot }
  "5_3": { x: 2.00, y: 0.40, role: patrol_slot }
  "5_4": { x: 2.80, y: 0.40, role: patrol_slot }

# 节点未指定 arrival 时：巡逻点用 visual_end，普通 junction 用 visual_odom。
# 有向驶入覆盖仅作用于 from_node -> to_node；反向继承目标节点的配置。
# handoff 是视觉交接位置，guard 是普通路口尚未交接时的保护停车位置，单位米。
# patrol_slot 不启用固定距离保护，仍保留 ODOM 新鲜度和视觉安全检查。
arrival_overrides:
  - from_node: "1_2"
    to_node: "2_2"
    handoff_progress_m: 0.80
    final_forward_m: 0.17
    guard_progress_m: 0.92

edges:
  # --- 出发区：先直行 15 cm 到顶端丁字口，再原地转向左右巡逻点 ---
  - id: "0_0__0_J"
    u: "0_0"
    v: "0_J"
    length_m: 0.15
    bidirectional: true

  - id: "0_J__1_2"
    u: "0_J"
    v: "1_2"
    length_m: 0.40
    bidirectional: true

  - id: "0_J__1_3"
    u: "0_J"
    v: "1_3"
    length_m: 0.40
    bidirectional: true

  # --- 格网边长 0.97 m。出发区三段不在此列：0_0—0_J 0.15 m，0_J—1_2 / 0_J—1_3 0.40 m ---
  # --- 各行横边：左点 — 左十字 — 右十字 — 右点 ---
  # 第 1 行只有 0_J—1_2 和 0_J—1_3；0_0 只连接 0_J。

  - id: "2_1__2_2"
    u: "2_1"
    v: "2_2"
    length_m: 0.97
    bidirectional: true
  - id: "2_2__2_3"
    u: "2_2"
    v: "2_3"
    length_m: 0.97
    bidirectional: true
    tunnel: true
  - id: "2_3__2_4"
    u: "2_3"
    v: "2_4"
    length_m: 0.97
    bidirectional: true

  - id: "3_1__3_2"
    u: "3_1"
    v: "3_2"
    length_m: 0.97
    bidirectional: true
  - id: "3_2__3_3"
    u: "3_2"
    v: "3_3"
    length_m: 0.97
    bidirectional: true
    tunnel: true
  - id: "3_3__3_4"
    u: "3_3"
    v: "3_4"
    length_m: 0.97
    bidirectional: true

  - id: "4_1__4_2"
    u: "4_1"
    v: "4_2"
    length_m: 0.97
    bidirectional: true
  - id: "4_2__4_3"
    u: "4_2"
    v: "4_3"
    length_m: 0.97
    bidirectional: true
    tunnel: true
  - id: "4_3__4_4"
    u: "4_3"
    v: "4_4"
    length_m: 0.97
    bidirectional: true

  - id: "5_1__5_2"
    u: "5_1"
    v: "5_2"
    length_m: 0.97
    bidirectional: true
  - id: "5_2__5_3"
    u: "5_2"
    v: "5_3"
    length_m: 0.97
    bidirectional: true
    tunnel: true
  - id: "5_3__5_4"
    u: "5_3"
    v: "5_4"
    length_m: 0.97
    bidirectional: true

  # --- 左列竖边（从第 2 行开始，上面是顶棚而不是 1_1）---
  - id: "2_1__3_1"
    u: "2_1"
    v: "3_1"
    length_m: 0.97
    bidirectional: true
  - id: "3_1__4_1"
    u: "3_1"
    v: "4_1"
    length_m: 0.97
    bidirectional: true
  - id: "4_1__5_1"
    u: "4_1"
    v: "5_1"
    length_m: 0.97
    bidirectional: true

  # --- 中间左十字列竖边 ---
  - id: "1_2__2_2"
    u: "1_2"
    v: "2_2"
    length_m: 0.97
    bidirectional: true
  - id: "2_2__3_2"
    u: "2_2"
    v: "3_2"
    length_m: 0.97
    bidirectional: true
  - id: "3_2__4_2"
    u: "3_2"
    v: "4_2"
    length_m: 0.97
    bidirectional: true
  - id: "4_2__5_2"
    u: "4_2"
    v: "5_2"
    length_m: 0.97
    bidirectional: true

  # --- 中间右十字列竖边 ---
  - id: "1_3__2_3"
    u: "1_3"
    v: "2_3"
    length_m: 0.97
    bidirectional: true
  - id: "2_3__3_3"
    u: "2_3"
    v: "3_3"
    length_m: 0.97
    bidirectional: true
  - id: "3_3__4_3"
    u: "3_3"
    v: "4_3"
    length_m: 0.97
    bidirectional: true
  - id: "4_3__5_3"
    u: "4_3"
    v: "5_3"
    length_m: 0.97
    bidirectional: true

  # --- 右列竖边（从第 2 行开始）---
  - id: "2_4__3_4"
    u: "2_4"
    v: "3_4"
    length_m: 0.97
    bidirectional: true
  - id: "3_4__4_4"
    u: "3_4"
    v: "4_4"
    length_m: 0.97
    bidirectional: true
  - id: "4_4__5_4"
    u: "4_4"
    v: "5_4"
    length_m: 0.97
    bidirectional: true
