# 示例：与 synth.default_camera / BevConfig 默认值对齐，实车需重标定。
# 白底白沿推荐权威配置：config/nav_camera.yaml

bev:
  y_min: 0.3
  y_max: 1.5
  x_min: -0.5
  x_max: 0.5
  m_per_px: 0.01

camera:
  height_m: 0.25
  pitch_deg: 28.0
  # fx/fy/cx/cy 可省略：按图像宽与约 63.3° FOV 估算

road_prior:
  expected_width_m: 0.8
  min_width_m: 0.35
  max_width_m: 1.15
  min_pixels: 3

temporal:
  smooth_alpha: 0.45
  y_match_tol_m: 0.04

# 也可改用四点标定（提供后将忽略 camera 外参估单应）：
# image_points:
#   - [320, 700]
#   - [960, 700]
#   - [1100, 400]
#   - [180, 400]
# ground_points:  # (X右, Y前) 米
#   - [-0.5, 0.3]
#   - [0.5, 0.3]
#   - [0.5, 1.5]
#   - [-0.5, 1.5]
